services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizzleap
      POSTGRES_USER: bizzleap
      POSTGRES_PASSWORD: bizzleap_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizzleap -d bizzleap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8787
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://bizzleap:bizzleap_dev_only@postgres:5432/bizzleap
    ports:
      - "8080:8080"
      - "8787:8787"

volumes:
  postgres_data:
