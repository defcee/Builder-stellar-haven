<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Bizzleap - Empowering farmers and small businesses to grow, connect, and thrive in the digital marketplace"
    />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bizzleap" />
    <meta name="msapplication-TileColor" content="#16a34a" />
    <title>Bizzleap - Empowering Farmers & Small Businesses</title>

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Bizzleap - Grow Your Business" />
    <meta
      property="og:description"
      content="Empowering farmers and small businesses to grow, connect, and thrive in the digital marketplace"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bizzleap.com" />
    <meta property="og:image" content="/placeholder.svg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bizzleap - Grow Your Business" />
    <meta
      name="twitter:description"
      content="Empowering farmers and small businesses to grow, connect, and thrive in the digital marketplace"
    />

    <meta name="twitter:image" content="/placeholder.svg" />

    <meta name="twitter:image" content="public/twitter-image.png" />

    <!-- Security Headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />


    <!-- Performance Hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
  </head>
  <body>
    <div id="root">
      <!-- Loading State -->
      <div
        style="
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(
            to bottom right,
            #dcfce7,
            #ffffff,
            #eff6ff
          );
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            sans-serif;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid #16a34a;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
          "
        ></div>
        <p style="color: #374151; font-size: 16px; font-weight: 500; margin: 0">
          Loading Bizzleap...
        </p>
      </div>
      <style>
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>


    <script type="module" src="/src/main.tsx"></script>

    <!-- React Entry Point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Capacitor App Scripts (only loaded in native app) -->
    <script>
      // Check if running in Capacitor
      if (window.Capacitor) {
        // Import Capacitor plugins
        import(
          "https://cdn.jsdelivr.net/npm/@capacitor/core@latest/dist/esm/index.js"
        )
          .then(({ Capacitor }) => {
            console.log("Running in Capacitor:", Capacitor.getPlatform());
          })
          .catch(console.warn);
      }
    </script>


    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }
    </script>

    <!-- PWA Install Prompt -->
    <script>
      let deferredPrompt;

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log("PWA install prompt available");
      });

      window.addEventListener("appinstalled", (evt) => {
        console.log("PWA was installed");
      });
    </script>

    <!-- Error Handling -->
    <script>
      window.addEventListener("error", (event) => {
        console.error("Global error:", event.error);
      });

      window.addEventListener("unhandledrejection", (event) => {
        console.error("Unhandled promise rejection:", event.reason);
      });
    </script>
  </body>
</html>
